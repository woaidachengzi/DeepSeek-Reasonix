[package]
name = "reasonix-tauri"
version = "0.1.0"
description = "Tauri host for the Reasonix desktop bridge"
authors = ["Reasonix Contributors"]
edition = "2021"
rust-version = "1.89.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
rand = "0.9"
same-file = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-single-instance = "2.4.5"
tauri-plugin-updater = "2.12.0"
tempfile = "3"
url = "2"
zip = { version = "4.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
percent-encoding = "2"
tauri-plugin-shell = "2.3.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext", "objc2-core-graphics"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSURL", "NSData", "NSDictionary", "NSGeometry", "NSBundle", "NSError", "NSObject", "NSArray"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGGeometry", "CGImage"] }

block2 = "0.6.2"
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSettings", "UNNotificationTrigger"] }

[target.'cfg(not(any(target_os = "macos", target_os = "linux")))'.dependencies]
notify-rust = "4.18.0"

[target.'cfg(target_os = "linux")'.dependencies]
gio = "0.18.4"
gdk-pixbuf = "0.18.5"
async-channel = "2.5.0"
async-io = "2.6.0"
futures-lite = "2.6.1"
zbus = "5.19.0"

[target.'cfg(target_os = "windows")'.dependencies]
png = "0.18.1"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_Com", "Win32_System_Environment", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
png = "0.18.1"

[target.'cfg(unix)'.dev-dependencies]
async-channel = "2.5.0"
async-io = "2.6.0"
futures-lite = "2.6.1"
zbus = "5.19.0"
