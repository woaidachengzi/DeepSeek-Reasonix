[package]
name = "reasonix-tauri"
version = "0.1.0"
description = "Tauri host for the Reasonix desktop bridge"
authors = ["Reasonix Contributors"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-notification = "2.4.0"
tauri-plugin-shell = "2.3.6"
tauri-plugin-single-instance = "2.4.5"
tauri-plugin-updater = "2.12.0"
tempfile = "3"
